name: Python and dbt checks
on:
  push:
  pull_request:

permissions:
  contents: read
  pages: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: commerce
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: commerce
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5434
      PGDATABASE: commerce
      PGUSER: commerce
      PGPASSWORD: commerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Python unit tests
        run: python -m pytest -q
      - name: PostgreSQL ingestion integration tests
        env:
          COMMERCE_INTEGRATION_TESTS: '1'
        run: python -m pytest -q tests/test_ingestion_integration.py
      - name: Generate fake data
        run: python -m commerce_pipeline.generate_sample_data
      - name: Ingest raw files
        run: python -m commerce_pipeline.ingest
      - name: Validate transformations and sources
        run: dbt build --profiles-dir .
      - name: Reconcile CSV metrics with built marts
        run: python -m commerce_pipeline.verify_metrics
      - name: Dashboard views and KPI integration test
        env:
          COMMERCE_DASHBOARD_TESTS: '1'
        run: python -m pytest -q tests/test_dashboard.py
      - name: Export verified public reporting snapshot
        run: python -m commerce_pipeline.export_demo
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload reporting demo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: demo
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified demo
        id: deployment
        uses: actions/deploy-pages@v4
